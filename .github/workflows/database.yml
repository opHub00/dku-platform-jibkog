name: PostgreSQL integration
on:
  pull_request:
    paths:
      - 'db/**'
      - 'server/**'
      - 'client/src/features/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/database.yml'
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jibkog
          POSTGRES_PASSWORD: local_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:local_test@localhost:5432/jibkog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --prefix db
      - run: node db/verify.mjs
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node db/verify-store.mjs
